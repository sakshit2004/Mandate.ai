  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"686158f0-9b73-464f-bae1-6ba43c3cb6e4\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n\n<x-dc>\n<helmet>\n<style>\n@font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url(\"3f5cb957-4fc6-4eac-8545-9d8c0eba6edf\") format('woff2'); font-display: swap; }\n@font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url(\"a5a232fb-22b3-4846-a432-59df859dd8ee\") format('woff2'); font-display: swap; }\n@font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: url(\"e4fe30cc-2e7d-41b1-b402-4c945fa1a99f\") format('woff2'); font-display: swap; }\n@font-face { font-family: 'IBM Plex Sans'; font-weight: 400; src: url(\"897e7713-2e24-420a-9cb0-7425e95410bd\") format('woff2'); font-display: swap; }\n@font-face { font-family: 'IBM Plex Sans'; font-weight: 500; src: url(\"f06ed479-4825-447a-b798-1adcdf041ed8\") format('woff2'); font-display: swap; }\n@font-face { font-family: 'IBM Plex Sans'; font-weight: 600; src: url(\"3a95fc5e-1846-4b92-b8ca-8bc1594b1ca8\") format('woff2'); font-display: swap; }\n@font-face { font-family: 'IBM Plex Serif'; font-weight: 500; font-style: italic; src: url(\"8535b906-1ddf-4ee9-97f0-30c1ad316c1d\") format('woff2'); font-display: swap; }\nhtml, body { margin: 0; padding: 0; background: #fbfaf4; }\nbody { font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #2f2d28; -webkit-font-smoothing: antialiased; }\na { color: #17171a; text-decoration: none; }\na:hover { color: #3a3833; }\n@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div data-screen-label=\"mandate landing — final\" style=\"background: #fbfaf4; overflow: hidden; min-height: 100vh; min-width: 1240px;\">\n\n      <nav style=\"display: flex; align-items: center; gap: 28px; padding: 16px 40px; border-bottom: 1px solid #e7e2d4; font-family: 'JetBrains Mono', monospace; font-size: 13px; position: sticky; top: 0; background: rgba(251,250,244,0.92); backdrop-filter: blur(8px); z-index: 10;\">\n        <div style=\"display: flex; align-items: center; gap: 8px; font-weight: 700; color: #17171a; font-size: 16px;\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\"><rect x=\"1.5\" y=\"1.5\" width=\"15\" height=\"15\" rx=\"2\" fill=\"none\" stroke=\"#17171a\" stroke-width=\"1.5\"><\u002Frect><rect x=\"4.5\" y=\"9\" width=\"9\" height=\"4.5\" fill=\"#17171a\"><\u002Frect><rect x=\"4.5\" y=\"4.5\" width=\"9\" height=\"2\" fill=\"#c9c2ae\"><\u002Frect><\u002Fsvg>\n          mandate\n        <\u002Fdiv>\n        <a href=\"#\" style=\"color: #5a564a; font-size: 13px;\">product<\u002Fa>\n        <a href=\"#\" style=\"color: #5a564a; font-size: 13px;\">who it's for<\u002Fa>\n        <a href=\"#\" style=\"color: #5a564a; font-size: 13px;\">docs<\u002Fa>\n        <div style=\"margin-left: auto; display: flex; gap: 12px; align-items: center;\">\n          <a href=\"#\" style=\"color: #5a564a; font-size: 13px;\">sign in<\u002Fa>\n          <button style=\"all: unset; padding: 7px 14px; background: #17171a; color: #fbfaf4; font-weight: 700; border-radius: 2px; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 12px;\" style-hover=\"background: #3a3833;\">join the beta<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fnav>\n\n      <!-- HERO -->\n      <div style=\"padding: 96px 40px 0; text-align: center; background: linear-gradient(180deg, #fbfaf4, #f4f1e8 340px, #fbfaf4 700px);\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7d7767; letter-spacing: 0.14em; margin-bottom: 20px;\">FOR AGENCIES RUNNING AI AGENTS ON CLIENT WORK<\u002Fdiv>\n        <h1 style=\"font-family: 'IBM Plex Serif', serif; font-style: italic; font-weight: 500; font-size: 72px; line-height: 1.04; letter-spacing: -0.03em; color: #17171a; margin: 0 auto; max-width: 860px;\">Bill your clients with proof, not guesswork.<\u002Fh1>\n        <p style=\"font-size: 18px; color: #5a564a; line-height: 1.55; max-width: 620px; margin: 26px auto 0;\">You pay OpenAI and Anthropic from one account, then re-bill from a spreadsheet. Mandate meters every call per client — with a hard cap on each — so the numbers on your invoice are the numbers that actually happened.<\u002Fp>\n        <div style=\"display: flex; gap: 8px; justify-content: center; margin-top: 36px;\">\n          <input placeholder=\"you@youragency.com\" style=\"width: 300px; padding: 13px 14px; background: #ffffff; border: 1px solid #c9c2ae; border-radius: 2px; color: #17171a; font-family: 'JetBrains Mono', monospace; font-size: 13px; outline: none;\" style-focus=\"border-color: #17171a; box-shadow: 0 0 0 1px #17171a, 0 0 24px -4px #17171a;\">\n          <button style=\"all: unset; padding: 13px 22px; background: #17171a; color: #fbfaf4; font-weight: 700; border-radius: 2px; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 13px;\" style-hover=\"background: #3a3833;\">request an invite<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #a49d8a; margin-top: 14px; letter-spacing: 0.04em;\">{{ betaSpots }} agencies in the first beta · $10 metered credit each · no card required<\u002Fdiv>\n\n        <!-- product shot -->\n        <div style=\"max-width: 1100px; margin: 56px auto 0; background: #ffffff; border: 1px solid #c9c2ae; border-bottom: none; border-radius: 6px 6px 0 0; overflow: hidden; text-align: left; box-shadow: 0 20px 60px -12px rgba(23,23,26,0.16);\">\n          <div style=\"display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid #e7e2d4;\">\n            <span style=\"width: 9px; height: 9px; border-radius: 999px; background: #d9d3c1;\"><\u002Fspan>\n            <span style=\"width: 9px; height: 9px; border-radius: 999px; background: #d9d3c1;\"><\u002Fspan>\n            <span style=\"width: 9px; height: 9px; border-radius: 999px; background: #d9d3c1;\"><\u002Fspan>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #a49d8a; margin-left: 10px; letter-spacing: 0.08em;\">app.mandate.dev · fieldnote automation<\u002Fspan>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #17171a; margin-left: auto; letter-spacing: 0.14em;\">● METERING LIVE · {{ liveSpend }} THIS WEEK<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1.2fr 1fr; gap: 0;\">\n            <div style=\"border-right: 1px solid #e7e2d4;\">\n              <div style=\"padding: 10px 14px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #7d7767; border-bottom: 1px solid #e7e2d4;\">SPEND · THIS MONTH · <span style=\"color: #17171a;\">SELECT A CLIENT ↗<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{ clientsT }}\" as=\"c\" hint-placeholder-count=\"8\">\n                <div sc-camel-on-click=\"{{ c.onSelect }}\" style=\"display: grid; grid-template-columns: 12px 150px 1fr 110px; gap: 10px; align-items: center; padding: 9px 14px; border-bottom: 1px solid #e7e2d4; cursor: pointer; background: {{ c.rowBg }}; box-shadow: {{ c.rowInset }};\" style-hover=\"background: #f4f1e8;\">\n                  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #17171a;\">{{ c.marker }}<\u002Fdiv>\n                  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #2f2d28; font-weight: {{ c.nameWeight }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ c.name }}<\u002Fdiv>\n                  <div style=\"height: 6px; background: #e7e2d4; border-radius: 2px; overflow: hidden;\">\n                    <div style=\"height: 100%; width: {{ c.pct }}%; background: {{ c.color }};\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{ c.amtColor }}; text-align: right;\">{{ c.amt }} <span style=\"color: #a49d8a;\">/ {{ c.cap }}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"display: flex; justify-content: space-between; padding: 10px 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7d7767;\">\n                <span>openai $521.14 · anthropic $223.61<\u002Fspan>\n                <span style=\"color: #17171a;\">total $744.75<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #ffffff; color: #17171a; padding: 20px 24px;\">\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #17171a; padding-bottom: 10px;\">\n                <div style=\"font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 15px;\">Usage statement<\u002Fdiv>\n                <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #5a5850;\">JUNE 2026 · {{ stmtName }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ stmtLines }}\" as=\"ln\" hint-placeholder-count=\"3\">\n                <div style=\"display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #d9d7cc; font-family: 'JetBrains Mono', monospace; font-size: 11.5px;\">\n                  <span>{{ ln.label }}<\u002Fspan><span>{{ ln.calls }} · <strong>{{ ln.cost }}<\u002Fstrong><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"display: flex; justify-content: space-between; padding: 10px 0 0; border-top: 2px solid #17171a; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 700; margin-top: -1px;\">\n                <span>total metered cost<\u002Fspan><span>{{ stmtTotal }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #5a5850; padding: 6px 0 0;\">\n                <span>monthly cap<\u002Fspan><span>{{ stmtCap }} · {{ stmtCapNote }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: #8a877a; letter-spacing: 0.08em; margin-top: 14px;\">PREPARED BY FIELDNOTE AUTOMATION · <span style=\"color: #17171a;\">✓ {{ stmtCalls }} CALLS ATTESTED<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- works with strip -->\n      <div style=\"border-top: 1px solid #e7e2d4; padding: 18px 40px; display: flex; gap: 36px; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #a49d8a; letter-spacing: 0.08em;\">\n        <span style=\"font-size: 10px; letter-spacing: 0.14em; color: #c9c2ae;\">WORKS WITH THE BILLING YOU ALREADY HAVE<\u002Fspan>\n        <span>openai<\u002Fspan><span>anthropic<\u002Fspan><span>n8n<\u002Fspan><span>make<\u002Fspan><span>vapi · soon<\u002Fspan><span>exa · soon<\u002Fspan>\n      <\u002Fdiv>\n\n      <!-- what it does -->\n      <div style=\"border-top: 1px solid #e7e2d4; padding: 80px 40px;\">\n        <div style=\"max-width: 1100px; margin: 0 auto;\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7d7767; letter-spacing: 0.14em; margin-bottom: 8px;\">WHAT IT DOES<\u002Fdiv>\n          <h2 style=\"font-family: 'IBM Plex Serif', serif; font-style: italic; font-weight: 500; font-size: 42px; letter-spacing: -0.03em; color: #17171a; margin: 0 0 40px; max-width: 640px;\">One spend-control layer between your agents and their APIs.<\u002Fh2>\n          <div style=\"display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: #e7e2d4; border: 1px solid #e7e2d4;\">\n            <div style=\"background: #fbfaf4; padding: 22px 20px;\">\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #17171a; letter-spacing: 0.12em;\">01 · BUDGETS<\u002Fdiv>\n              <div style=\"font-size: 16px; color: #17171a; font-weight: 500; margin: 10px 0 8px;\">Hard caps, enforced<\u002Fdiv>\n              <div style=\"font-size: 13px; color: #5a564a; line-height: 1.55;\">A key per client with a dollar cap. When it's spent, requests stop automatically — mid-run, no human needed.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #fbfaf4; padding: 22px 20px;\">\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #17171a; letter-spacing: 0.12em;\">02 · LIVE TRACKING<\u002Fdiv>\n              <div style=\"font-size: 16px; color: #17171a; font-weight: 500; margin: 10px 0 8px;\">Spend, right now<\u002Fdiv>\n              <div style=\"font-size: 13px; color: #5a564a; line-height: 1.55;\">Real-time spend per client and per provider, down to the model — not when the invoice hits.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #fbfaf4; padding: 22px 20px;\">\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #17171a; letter-spacing: 0.12em;\">03 · KILL SWITCH<\u002Fdiv>\n              <div style=\"font-size: 16px; color: #17171a; font-weight: 500; margin: 10px 0 8px;\">One click, all stop<\u002Fdiv>\n              <div style=\"font-size: 13px; color: #5a564a; line-height: 1.55;\">Instantly block any client's agents, even mid-task. For the looping agent at 2am. One click re-enables.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #fbfaf4; padding: 22px 20px;\">\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #17171a; letter-spacing: 0.12em;\">04 · ALERTS<\u002Fdiv>\n              <div style=\"font-size: 16px; color: #17171a; font-weight: 500; margin: 10px 0 8px;\">Warned at 80%<\u002Fdiv>\n              <div style=\"font-size: 13px; color: #5a564a; line-height: 1.55;\">Automatic email when any client crosses 80% of budget — while there's still time to act.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #fbfaf4; padding: 22px 20px;\">\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #17171a; letter-spacing: 0.12em;\">05 · STATEMENTS<\u002Fdiv>\n              <div style=\"font-size: 16px; color: #17171a; font-weight: 500; margin: 10px 0 8px;\">Client-ready PDFs<\u002Fdiv>\n              <div style=\"font-size: 13px; color: #5a564a; line-height: 1.55;\">One-click PDF per client — usage, costs, totals, period. Bill cost-plus with proof, not spreadsheet screenshots.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- budget + alerts live demo -->\n      <div style=\"border-top: 1px solid #e7e2d4; padding: 80px 40px;\">\n        <div style=\"max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 500px 1fr; gap: 64px; align-items: center;\">\n          <div style=\"background: #ffffff; border: 1px solid #c9c2ae; border-radius: 4px; overflow: hidden;\">\n            <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid #e7e2d4; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #7d7767;\">\n              <span>BUDGET · COPPERLINE HVAC<\u002Fspan>\n              <span style=\"color: #17171a;\">{{ bStatus }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding: 18px 14px 14px;\">\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7d7767; margin-bottom: 6px;\">\n                <span>monthly cap — drag to set<\u002Fspan>\n ace; font-size: 11px; background: #17171a; color: #fbfaf4;\">■ CAP REACHED · requests blocked upstream, mid-run · no human needed<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid #e7e2d4;\">\n              <button sc-camel-on-click=\"{{ bRunDay }}\" style=\"all: unset; padding: 6px 14px; border-radius: 2px; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; background: rgba(23,23,26,0.06); color: #17171a; border: 1px solid #17171a;\">▸ simulate a busy day<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ bReset }}\" style=\"all: unset; padding: 6px 14px; border-radius: 2px; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7d7767; border: 1px solid #c9c2ae;\">reset month<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #17171a; letter-spacing: 0.14em; margin-bottom: 8px;\">BUDGETS + ALERTS · TRY IT<\u002Fdiv>\n            <h2 style=\"font-family: 'IBM Plex Serif', serif; font-style: italic; font-weight: 500; font-size: 38px; letter-spacing: -0.03em; color: #17171a; margin: 0 0 16px;\">Set a cap. Watch it hold.<\u002Fh2>\n            <p style=\"font-size: 15px; color: #5a564a; line-height: 1.6; margin: 0; max-width: 460px;\">Every client key carries a hard dollar cap. At 80% you get an email while there's still time to act. At 100% requests stop automatically — mid-run, no human needed. Drag the cap or run a few busy days and see both fire.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- kill switch live block -->\n      <div style=\"border-top: 1px solid #e7e2d4; padding: 80px 40px; background: #f4f1e8;\">\n        <div style=\"max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 500px; gap: 6 ];\n  pool = [\n    { body: 'millbrook-legal → openai gpt-4o · 2,140 tok · $0.0214', mark: '✓', markColor: '#00d17a' },\n    { body: 'millbrook-legal → anthropic claude-sonnet-4 · 890 tok · $0.0121', mark: '✓', markColor: '#00d17a' },\n    { body: 'millbrook-legal → openai gpt-4o-mini · 6,480 tok · $0.0039', mark: '✓', markColor: '#00d17a' },\n    { body: 'millbrook-legal → openai gpt-4o · 4,020 tok · $0.0402', mark: '✓', markColor: '#00d17a' },\n    { body: 'millbrook-legal → anthropic claude-sonnet-4 · 1,204 tok · $0.0163', mark: '✓', markColor: '#00d17a' },\n  ];\n  utc() {\n    const d = new Date();\n    const p = (n) => String(n).padStart(2, '0');\n    return p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds()) + 'Z';\n  }\n  componentDidMount() {\n    const seed = [];\n    for (let i = 0; i < 6; i++) seed.push({ ts: this.utc(), ...this.pool[i % this.pool.length] });\n    this.setState({ feedLines: seed });\n    this.timer = setInterval(() => {\n      if (this.props.liveTicker === false) return;\n      this.setState((s) => {\n        const next = { spend: s.spend + Math.random() * 0.12 + 0.01 };\n        if (!s.killed) {\n          const ln = { ts: this.utc(), ...this.pool[Math.floor(Math.random() * this.pool.length)] };\n          next.feedLines = [ln, ...s.feedLines].slice(0, 6);\n          next.clientSpend = Math.min(199.99, s.clientSpend + Math.random() * 0.04);\n          next.bSpend = Math.min(s.bCap, s.bSpend + Math.random() * 0.06);\n        } else {\n          const ln = { ts: this.utc(), body: 'millbrook-legal → openai gpt-4o · call rejected · key killed', mark: '✕', markColor: '#17171a' };\n          next.feedLines = [ln, ...s.feedLines].slice(0, 6);\n        }\n        return next;\n      });\n    }, 1100);\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n  renderVals() {\n    const money = (n) => '$' + n.toFixed(2);\n    const killed = this.state.killed;\n    const active = this.tabData[this.state.tab];\n    return {\n      tabs: this.tabData.map((t, i) => ({\n        label: t.label,\n        color: i === this.state.tab ? '#e8ecef' : '#6b7580',\n        borderColor: i === this.state.tab ? '#00d17a' : 'transparent',\n        onSelect: () => this.setState({ tab: i }),\n      })),\n      activeHeading: active.heading,\n      activeBody: active.body,\n      activeBullets: active.bullets,\n      faqs: this.faqData.map((f, i) => ({\n        q: f.q,\n        a: f.a,\n        open: this.state.faqOpen === i,\n        glyph: this.state.faqOpen === i ? '−' : '+',\n        glyphColor: this.state.faqOpen === i ? '#00d17a' : '#4a535b',\n        onToggle: () => this.setState((s) => ({ faqOpen: s.faqOpen === i ? -1 : i })),\n      })),\n      clientsT: this.heroClients.map((c, i) => {\n        const sel = i === this.state.heroSel;\n        return {\n          name: c.name, amt: c.amt, cap: c.cap, pct: c.pct,\n          color: sel ? '#17171a' : '#a49d8a',\n          amtColor: sel ? '#17171a' : '#7d7767',\n          marker: sel ? '▸' : '',\n          nameWeight: sel ? 700 : 400,\n          rowBg: sel ? '#f4f1e8' : 'transparent',\n          rowInset: sel ? 'inset 2px 0 0 #17171a' : 'none',\n          onSelect: () => this.setState({ heroSel: i }),\n        };\n      }),\n      stmtName: this.heroClients[this.state.heroSel].name.replace(/-/g, ' ').toUpperCase(),\n      stmtLines: this.heroClients[this.state.heroSel].lines,\n      stmtTotal: this.heroClients[this.state.heroSel].amt,\n      stmtCap: this.heroClients[this.state.heroSel].cap,\n      stmtCapNote: this.heroClients[this.state.heroSel].capped ? 'CAP REACHED — CALLS STOPPED' : 'within budget',\n      stmtCalls: this.heroClients[this.state.heroSel].calls,\n      feedLinesT: this.state.feedLines.map((l) => (l.markColor === '#00d17a' ? { ...l, markColor: '#17171a' } : l)),\n      meterColorT: killed ? '#17171a' : '#17171a',\n      meterAmtColorT: killed ? '#17171a' : '#5a564a',\n      killBtnBgT: killed ? 'transparent' : 'rgba(23,23,26,0.06)',\n      killBtnFgT: killed ? '#17171a' : '#17171a',\n      killBtnBorderT: killed ? '#17171a' : '#17171a',\n      tabsT: this.tabData.map((t, i) => ({\n        label: t.label,\n        color: i === this.state.tab ? '#17171a' : '#7d7767',\n        borderColor: i === this.state.tab ? '#17171a' : 'transparent',\n        onSelect: () => this.setState({ tab: i }),\n      })),\n      faqsT: this.faqData.map((f, i) => ({\n        q: f.q,\n        a: f.a,\n        open: this.state.faqOpen === i,\n        glyph: this.state.faqOpen === i ? '−' : '+',\n        glyphColor: this.state.faqOpen === i ? '#17171a' : '#a49d8a',\n        onToggle: () => this.setState((s) => ({ faqOpen: s.faqOpen === i ? -1 : i })),\n      })),\n      bCap: this.state.bCap,\n      bCapVal: '$' + this.state.bCap.toFixed(2),\n      bSpendVal: money(this.state.bSpend),\n      bPct: Math.min(100, Math.round((this.state.bSpend / this.state.bCap) * 100)),\n      bPctLabel: Math.min(100, Math.round((this.state.bSpend / this.state.bCap) * 100)) + '% of cap',\n      bAlert: this.state.bSpend / this.state.bCap >= 0.8,\n      bBlocked: this.state.bSpend >= this.state.bCap,\n      bStatus: this.state.bSpend >= this.state.bCap ? '■ ENFORCED' : (this.state.bSpend / this.state.bCap >= 0.8 ? '✉ ALERTED' : '● METERING'),\n      onBCap: (e) => { const v = Number(e.target.value); this.setState((s) => ({ bCap: v, bSpend: Math.min(s.bSpend, v) })); },\n      bRunDay: () => this.setState((s) => ({ bSpend: Math.min(s.bCap, s.bSpend + 9 + Math.random() * 6) })),\n      bReset: () => this.setState({ bSpend: 12.3 }),\n      betaSpots: this.props.betaSpots ?? 10,\n      liveSpend: money(this.state.spend),\n      clients: [\n        { name: 'millbrook-legal', amt: '$187.02', cap: '$200', pct: 94, color: '#5a564a', amtColor: '#5a564a' },\n        { name: 'harbor-dental', amt: '$84.12', cap: '$150', pct: 56, color: '#00d17a', amtColor: '#c8d0d8' },\n        { name: 'atlas-freight', amt: '$250.00', cap: '$250', pct: 100, color: '#17171a', amtColor: '#17171a' },\n        { name: 'beacon-realty', amt: '$62.31', cap: '$120', pct: 52, color: '#00d17a', amtColor: '#c8d0d8' },\n        { name: 'juniper-wellness', amt: '$41.66', cap: '$75', pct: 55, color: '#00d17a', amtColor: '#c8d0d8' },\n        { name: 'copperline-hvac', amt: '$23.55', cap: '$100', pct: 24, color: '#00d17a', amtColor: '#c8d0d8' },\n        { name: 'northgate-auto', amt: '$17.20', cap: '$60', pct: 29, color: '#00d17a', amtColor: '#c8d0d8' },\n        { name: 'verde-landscaping', amt: '$9.80', cap: '$50', pct: 20, color: '#00d17a', amtColor: '#c8d0d8' },\n      ],\n      feedLines: this.state.feedLines,\n      liveClientSpend: killed ? '$187.02' : money(this.state.clientSpend),\n      killed,\n      meterLabel: killed ? '✕ KILLED' : '● METERING',\n      meterColor: killed ? '#17171a' : '#00d17a',\n      meterAmtColor: killed ? '#17171a' : '#5a564a',\n      toggleKill: () => this.setState((s) => ({ killed: !s.killed })),\n      killBtnLabel: killed ? 're-arm key' : '✕ kill switch',\n      killBtnBg: killed ? 'transparent' : 'rgba(23,23,26,0.06)',\n      killBtnFg: killed ? '#00d17a' : '#17171a',\n      killBtnBorder: killed ? '#00d17a' : '#17171a',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
