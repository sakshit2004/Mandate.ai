name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mandate
          POSTGRES_PASSWORD: mandate
          POSTGRES_DB: mandate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mandate -d mandate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mandate:mandate@127.0.0.1:5432/mandate_test
      ENCRYPTION_KEY: test-encryption-key-at-least-32-characters
      CLERK_SECRET_KEY: sk_test_000000000000000000000000000000000000
      CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsudGVzdCQ=
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsudGVzdCQ=
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_000000000000000000000000000000000000
      APP_ORIGINS: http://localhost:8788
      STANDALONE: "1"
      EMAIL_CONSOLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build
